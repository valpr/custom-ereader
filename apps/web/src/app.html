<!doctype html>
<html class="writing-horizontal-tb h-full w-full" lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1"
      name="viewport"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="152x152" href="%sveltekit.assets%/favicon.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%sveltekit.assets%/icons/regular-icon@32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="%sveltekit.assets%/icons/regular-icon@16x16.png"
    />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="theme-color" content="#37474f" />
    <link rel="mask-icon" href="%sveltekit.assets%/safari-pinned-tab.svg" color="#37474f" />
    <script>
      try {
        var savedTheme = localStorage.getItem('appTheme') || 'system';
        var mode = savedTheme === 'stone' ? 'light' : savedTheme === 'gothic' ? 'dark' : savedTheme;
        document.documentElement.setAttribute('data-astryx-theme', 'neutral');
        if (mode === 'light' || mode === 'dark') {
          document.documentElement.setAttribute('data-theme', mode);
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
      } catch (e) {
        document.documentElement.setAttribute('data-astryx-theme', 'neutral');
      }
    </script>
    <title>Valpr Reader</title>
    <meta name="google-site-verification" content="916pIDYceOSD7LX-xhfZdnFF3Hw5ocDu_OQPIfB3W-w" />
    %sveltekit.head%
  </head>
  <body class="h-full w-full break-words font-sans" data-sveltekit-preload-data="hover">
    <div class="h-full w-full">%sveltekit.body%</div>
  </body>
</html>
