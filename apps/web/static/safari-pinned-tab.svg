<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- VL Monogram - monochrome for Safari pinned tab -->
  <!-- Black #000000 paths, transparent background, rounded caps -->
  <g stroke="#000000" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- V - left arm taller than right arm -->
    <path d="M 18 12 L 42 78 L 68 26" />
    <!-- L - left edge parallel to V's right edge, corner close to V -->
    <path d="M 66 46 L 46 86 L 83 86" />
  </g>
</svg>
